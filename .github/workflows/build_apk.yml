name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Setup Android SDK Tools
        run: |
          mkdir -p $HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip -d $HOME/cmdline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv $HOME/cmdline-tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          rm tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses and Build
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          cd app
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.custom.glasswidget'
              compileSdk 34
              defaultConfig {
                  applicationId "com.custom.glasswidget"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
          }
          EOF
          
          # Tự biên dịch thủ công tệp APK trực tiếp qua công cụ aapt và d8 (không cần Gradle)
          mkdir -p build/intermediates build/outputs/apk/debug
          aapt2 compile --dir src/main/res -o build/intermediates/res.zip
          aapt2 link -I $HOME/android-sdk/platforms/android-34/android.jar \
                     --manifest src/main/AndroidManifest.xml \
                     -o build/intermediates/app.apk \
                     build/intermediates/res.zip \
                     --auto-add-overlay
          
          # Biên dịch mã nguồn Java
          javac -source 17 -target 17 -cp $HOME/android-sdk/platforms/android-34/android.jar \
                -d build/intermediates/classes \
                src/main/java/com/custom/glasswidget/*.java
          
          # Đóng gói dex và đưa vào APK
          cd build/intermediates
          dx --dex --output=classes.dex classes/ 2>/dev/null || true
          # Nếu máy chủ dùng d8:
          find classes -name "*.class" > sources.txt || true
          $HOME/android-sdk/build-tools/34.0.0/d8 --lib $HOME/android-sdk/platforms/android-34/android.jar --output . @sources.txt || true
          
          aapt package -u -z -f -M ../src/main/AndroidManifest.xml \
                       -I $HOME/android-sdk/platforms/android-34/android.jar \
                       -F final.apk
          # Đưa classes.dex vào APK
          zip -u final.apk classes.dex || true
          cp final.apk outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassWidget-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
